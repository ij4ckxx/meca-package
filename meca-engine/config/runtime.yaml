concurrency:
  worker_count: 8
  mechanism: process_pool
retry:
  max_attempts: 3
  backoff_base_seconds: 2
  backoff_multiplier: 2
  backoff_max_seconds: 60
validation:
  dtd_validation_enabled: true
  severity_block_threshold: HIGH
staging:
  strategy: full_local_staging
  working_dir_root: /var/meca-engine/work
output:
  operational_bucket: meca-output-operational
  archival_bucket: meca-output-archival
  provider: LOCAL
  local_path: ./archive_migration_validation/generated_packages
checkpoint:
  backend: postgres
doi_registry:
  backend: postgres
packaging:
  zip_compression: deflated
  zip_compresslevel: 6
  staging_subdir_name: package_staging
  overwrite_policy: fail
input:
  provider: LOCAL
  local_path: ./Input
dashboard:
  reports_path: ./archive_migration_validation
logging:
  level: INFO
