# raw.xml generator settings — Business Rule Book BR-036–050.
# Every value confirmed 3/3 against the real reference packages
# (Output/*.zip); see 18/19 milestone reports for the underlying evidence.

doctype_public_id: "-//NLM//DTD JATS (Z39.96) Journal Publishing DTD v1.3 20210610//EN"
doctype_system_id: "JATS-journalpublishing1-3.dtd"
article_type: research-article
dtd_version: "1.3"
default_xml_lang: en
encoding: UTF-8
namespace_prefixes:
  - mml
  - xlink
  - xsi
  - ali
# Confirmed 3/3: one element per line, zero indentation regardless of
# nesting depth (not hierarchical indentation).
pretty_indent_spaces: 0
